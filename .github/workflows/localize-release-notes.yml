name: Localize Sparkle release notes

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag with a signed Sparkle ZIP and signature sidecar
        required: true
        type: string
      resync_archive:
        description: Resync a verified replacement ZIP for the same build and URL
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  localize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify the release archive and prepare the appcast
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RESYNC_ARCHIVE: ${{ inputs.resync_archive }}
        run: python3 .github/scripts/prepare_sparkle_appcast.py "$RELEASE_TAG"
      - name: Translate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 .github/scripts/sync_sparkle_release_notes.py "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: localized-appcast
          path: appcast.xml
          if-no-files-found: error
