name: Localize Sparkle release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag already in the TranSeek appcast
        required: true
        type: string

permissions:
  contents: read

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TranSeek appcast
        run: curl --fail --silent --show-error --location https://transeekmac.com/appcast.xml --output appcast.xml
      - name: Translate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/sync_sparkle_release_notes.py "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: localized-appcast
          path: appcast.xml
          if-no-files-found: error
